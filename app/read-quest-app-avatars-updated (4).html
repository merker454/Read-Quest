<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <meta name="description" content="A gamified reading tracker app with quizzes, achievements, and challenges">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Read Quest">
  <link rel="manifest" href="/Read-Quest/app/manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect fill='%23667eea' width='192' height='192'/%3E%3Ctext x='50%' y='50%' font-size='120' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
  <title>Read Quest - Track Your Reading Progress</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .profile-selector {
      padding: 16px 24px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .profile-selector-label {
      font-size: 12px;
      white-space: nowrap;
      opacity: 0.9;
    }
    .profile-btn-wrapper {
      position: relative;
      display: inline-block;
    }
    .profile-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.2s;
      color: white;
    }
    .profile-btn.active {
      background: white;
      color: #667eea;
      border-color: white;
    }
    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: rgba(255,255,255,0.2);
    }
    .profile-btn.active .profile-avatar {
      background: #667eea;
    }
    .profile-actions {
      position: absolute;
      top: -8px;
      right: -8px;
      display: flex;
      gap: 4px;
    }
    .profile-edit-btn, .profile-delete-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      color: white;
      border: none;
      font-size: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }
    .profile-edit-btn {
      background: #2196F3;
    }
    .profile-delete-btn {
      background: #ff4444;
    }
    .profile-btn-wrapper:hover .profile-edit-btn,
    .profile-btn-wrapper:hover .profile-delete-btn {
      display: flex;
    }
    .btn-new-profile {
      padding: 8px 12px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-new-profile:hover {
      background: rgba(255,255,255,0.3);
    }
    .header {
      padding: 24px;
      border-bottom: 1px solid #e5e5e5;
      background: linear-gradient(to bottom, #fafafa, white);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      font-size: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0f4ff 0%, #faf0ff 100%);
      border: 2px solid #667eea;
    }
    .header h1 { font-size: 28px; font-weight: 700; color: #667eea; }
    .header h1 span { color: #d32f2f; }
    .header-info { text-align: right; }
    .header-info p { font-size: 14px; margin: 0; color: #666; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }
    .stat-card { background: linear-gradient(135deg, #f0f4ff 0%, #faf0ff 100%); padding: 12px; border-radius: 8px; border: 1px solid #e5e5e5; }
    .stat-label { font-size: 12px; color: #999; margin-bottom: 4px; }
    .stat-value { font-size: 20px; font-weight: 700; color: #667eea; }
    .tabs {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e5e5;
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      color: #999;
      font-weight: 400;
      white-space: nowrap;
    }
    .tab-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-weight: 500; }
    .tab-content { padding: 24px; display: none; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 14px; display: block; margin-bottom: 8px; font-weight: 500; color: #1a1a1a; }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e5e5e5;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23667eea' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 20px;
      padding-right: 35px;
    }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    textarea { resize: vertical; min-height: 70px; }
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .avatar-option {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid #e5e5e5;
      border-radius: 12px;
      background: #f9f9f9;
      cursor: pointer;
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .avatar-option:hover {
      border-color: #667eea;
      transform: scale(1.05);
    }
    .avatar-option.selected {
      border-color: #667eea;
      background: linear-gradient(135deg, #f0f4ff 0%, #faf0ff 100%);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
    .level-btn {
      padding: 16px;
      border: 1.5px solid #e5e5e5;
      border-radius: 8px;
      background: #f9f9f9;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
    }
    .level-btn.selected { border-color: #667eea; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .level-subtitle { font-size: 12px; opacity: 0.8; margin-top: 4px; }
    .level-points { font-size: 13px; margin-top: 6px; opacity: 0.9; }
    .book-selector-box {
      background: linear-gradient(135deg, #f0f4ff 0%, #faf0ff 100%);
      border: 2px solid #667eea;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .book-selector-box h3 {
      font-size: 16px;
      font-weight: 600;
      color: #667eea;
      margin-bottom: 16px;
    }
    .book-selector-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 12px;
    }
    .book-selector-row select {
      width: 100%;
    }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-add { background: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-add:hover { background: #bbdefb; }
    .btn-quiz { background: #fce4ec; color: #c2185b; border: 1px solid #f8bbd0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-delete { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .add-book-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 8px;
      border: 1px solid #e5e5e5;
      margin-bottom: 24px;
    }
    .add-book-form h3 {
      margin: 0;
      font-size: 14px;
      color: #667eea;
    }
    .book-list { display: flex; flex-direction: column; gap: 12px; }
    .book-card { padding: 12px; background: #f9f9f9; border-radius: 8px; border: 1px solid #e5e5e5; border-left: 4px solid #667eea; }
    .book-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px; }
    .book-title { font-size: 15px; font-weight: 500; margin: 0; }
    .book-progress { font-size: 13px; color: #999; margin: 4px 0 0; }
    .points-badge { font-size: 12px; background: #e3f2fd; color: #667eea; padding: 4px 8px; border-radius: 4px; }
    .progress-bar { display: flex; height: 6px; background: #e5e5e5; border-radius: 3px; margin-bottom: 12px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); }
    .button-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .button-group button { flex: 1; min-width: 100px; }
    .empty-message { text-align: center; color: #999; padding: 24px; }
    .quiz-container { background: #f9f9f9; padding: 16px; border-radius: 8px; border: 1px solid #e5e5e5; margin-bottom: 16px; }
    .quiz-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #667eea; }
    .question-card { background: white; padding: 16px; border-radius: 8px; border: 1px solid #e5e5e5; margin-bottom: 16px; }
    .question-number { font-size: 12px; color: #999; margin-bottom: 8px; }
    .question-text { font-size: 14px; font-weight: 500; margin-bottom: 12px; }
    .option { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .option input[type="radio"], .option input[type="checkbox"] { cursor: pointer; }
    .option label { cursor: pointer; flex: 1; }
    .short-answer { width: 100%; padding: 8px 12px; border: 1px solid #e5e5e5; border-radius: 6px; }
    .quiz-results { background: #e8f5e9; padding: 16px; border-radius: 8px; border: 1px solid #c8e6c9; margin-bottom: 16px; }
    .results-score { font-size: 18px; font-weight: 600; color: #2e7d32; margin-bottom: 8px; }
    .results-detail { font-size: 13px; color: #666; }
    .achievement-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .achievement-card { padding: 12px; background: #f9f9f9; border-radius: 8px; border: 1px solid #e5e5e5; text-align: center; opacity: 0.5; }
    .achievement-card.unlocked { background: #e8f5e9; border-color: #c8e6c9; opacity: 1; }
    .achievement-emoji { font-size: 24px; margin-bottom: 6px; }
    .achievement-name { font-size: 12px; color: #999; margin: 0; }
    .challenge-card { padding: 16px; background: #f9f9f9; border-radius: 8px; border: 1px solid #e5e5e5; margin-bottom: 16px; }
    .challenge-card.completed { background: #e8f5e9; border-color: #c8e6c9; }
    .challenge-title { font-size: 16px; font-weight: 600; margin: 0 0 12px; color: #667eea; }
    .challenge-desc { font-size: 14px; color: #666; margin: 0 0 12px; }
    .challenge-progress { display: flex; height: 8px; background: #e5e5e5; border-radius: 4px; margin-bottom: 12px; overflow: hidden; }
    .challenge-stat { font-size: 13px; color: #666; margin-bottom: 12px; font-weight: 500; }
    .reward-section { background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%); padding: 12px; border-radius: 8px; border: 1px solid #ffcc80; margin-top: 12px; }
    .reward-section h4 { font-size: 13px; font-weight: 600; color: #e65100; margin: 0 0 8px; }
    .reward-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .reward-option { padding: 10px; background: white; border: 1.5px solid #ffcc80; border-radius: 6px; cursor: pointer; text-align: center; font-size: 12px; font-weight: 500; color: #e65100; transition: all 0.2s; }
    .reward-option:hover { background: #fff9c4; border-color: #ff9800; transform: scale(1.05); }
    .reward-option.selected { background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%); color: white; border-color: #f57c00; }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      overflow-y: auto;
    }
    .modal.active {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      margin-top: 20px;
    }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #667eea; }
    .modal-close {
      float: right;
      cursor: pointer;
      font-size: 24px;
      color: #999;
    }
    .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
    .modal-buttons button { flex: 1; }
    .btn-secondary { background: #e5e5e5; color: #1a1a1a; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn-secondary:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-selector">
      <span class="profile-selector-label">Reader:</span>
      <div id="profileButtons" style="display:flex;gap:8px;flex:1;overflow-x:auto"></div>
      <button class="btn-new-profile" onclick="showNewProfileModal()">+ New</button>
    </div>

    <div class="header">
      <div class="header-top">
        <div class="header-left">
          <div class="header-avatar" id="headerAvatar">😊</div>
          <div>
            <h1>Read<span>Quest</span></h1>
            <p id="userLevel">Level: Not selected</p>
          </div>
        </div>
        <div class="header-info">
          <p id="userName">Guest</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Points</div>
          <div class="stat-value" id="pointsValue">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Books</div>
          <div class="stat-value" id="booksValue">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Streak</div>
          <div class="stat-value" id="streakValue">0</div>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('profile')">Profile</button>
      <button class="tab-btn" onclick="switchTab('books')">Books</button>
      <button class="tab-btn" onclick="switchTab('recommendations')">Recommendations</button>
      <button class="tab-btn" onclick="switchTab('achievements')">Achievements</button>
      <button class="tab-btn" onclick="switchTab('challenges')">Challenges</button>
    </div>

    <div class="tab-content active" id="tab-profile">
      <div class="form-group">
        <label class="form-label">Your name</label>
        <input type="text" id="profileName" placeholder="Enter your name" onchange="updateProfile()">
      </div>
      <div class="form-group">
        <label class="form-label">Select your reading level</label>
        <div class="level-grid">
          <button class="level-btn" onclick="selectLevel(0)"><div>Early Reader</div><div class="level-subtitle">K-5</div><div class="level-points">5 pts/ch</div></button>
          <button class="level-btn" onclick="selectLevel(1)"><div>Junior</div><div class="level-subtitle">6-9</div><div class="level-points">8 pts/ch</div></button>
          <button class="level-btn" onclick="selectLevel(2)"><div>Teen</div><div class="level-subtitle">9-12</div><div class="level-points">10 pts/ch</div></button>
          <button class="level-btn" onclick="selectLevel(3)"><div>Adult</div><div class="level-subtitle">17+</div><div class="level-points">12 pts/ch</div></button>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-books">
      <div id="bookContent"></div>
    </div>

    <div class="tab-content" id="tab-recommendations">
      <div id="recContent"></div>
    </div>

    <div class="tab-content" id="tab-achievements">
      <div class="achievement-grid" id="achievementsGrid"></div>
    </div>

    <div class="tab-content" id="tab-challenges">
      <div id="challengesContent"></div>
    </div>
  </div>

  <div class="modal" id="newProfileModal">
    <div class="modal-content">
      <span class="modal-close" onclick="hideNewProfileModal()">&times;</span>
      <div class="modal-title">Create New Reader</div>
      <div class="form-group">
        <label class="form-label">Reader name</label>
        <input type="text" id="newProfileName" placeholder="Enter name">
      </div>
      <div class="form-group">
        <label class="form-label">Choose an avatar</label>
        <div class="avatar-grid" id="avatarGrid"></div>
      </div>
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="hideNewProfileModal()">Cancel</button>
        <button class="btn-primary" onclick="createNewProfile()">Create reader</button>
      </div>
    </div>
  </div>

  <div class="modal" id="editProfileModal">
    <div class="modal-content">
      <span class="modal-close" onclick="hideEditProfileModal()">&times;</span>
      <div class="modal-title">Edit Reader</div>
      <div class="form-group">
        <label class="form-label">Reader name</label>
        <input type="text" id="editProfileName" placeholder="Enter name">
      </div>
      <div class="form-group">
        <label class="form-label">Choose an avatar</label>
        <div class="avatar-grid" id="editAvatarGrid"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Reading level</label>
        <div class="level-grid" id="editLevelGrid"></div>
      </div>
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="hideEditProfileModal()">Cancel</button>
        <button class="btn-primary" onclick="saveEditedProfile()">Save changes</button>
      </div>
    </div>
  </div>

  <div class="modal" id="quizModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeQuiz()">&times;</span>
      <div class="quiz-title" id="quizTitle"></div>
      <div id="quizContent"></div>
    </div>
  </div>

  <script>
    // Version: 2.1 - Updated with book dropdowns and rewards
    console.log('Read Quest App v2.1 Loaded');
    
    const AVATARS = ['😊', '🤓', '😎', '🥰', '😌', '🤗', '😄', '🎉'];
    const LEVELS = [
      { name: "Early Reader", grade: "K-5", points: 5 },
      { name: "Junior", grade: "6-9", points: 8 },
      { name: "Teen", grade: "9-12", points: 10 },
      { name: "Adult", grade: "17+", points: 12 }
    ];

    const REWARDS = [
      { id: 'gold-badge', name: '🏆 Gold Badge', icon: '🏆' },
      { id: 'trophy', name: '🥇 Trophy', icon: '🥇' },
      { id: 'star', name: '⭐ Shiny Star', icon: '⭐' },
      { id: 'gem', name: '💎 Gem', icon: '💎' },
      { id: 'ribbon', name: '🎀 Ribbon', icon: '🎀' },
      { id: 'medal', name: '🥈 Medal', icon: '🥈' }
    ];

    const RECOMMENDATIONS = {
      0: [
        { title: "Jennifer Chan Is Not Alone", author: "Tae Keller", chapters: 28 },
        { title: "Weird Sad and Silent", author: "Alison McGhee", chapters: 28 },
        { title: "The Door of No Return", author: "Kwame Alexander", chapters: 28 },
        { title: "The Last Cuentista", author: "Donna Barba Higuera", chapters: 28 },

      event.stopPropagation();

        allProfiles = allProfiles.filter(p => p.id !== profileId);

        }

        renderProfileButtons();
      }

    function renderBooks() {
      const profile = getCurrentProfile();
      if (profile.level === null) {
        document.getElementById("bookContent").innerHTML = "<p class='empty-message'>Select a reading level first</p>";
        return;
      }
      
      let html = "";
      
      // Book Selector Box
      html += "<div class='book-selector-box'>";
      html += "<h3>📚 Add a Book</h3>";
      
      // Tab-like switcher
      html += "<div style='display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 2px solid rgba(102,126,234,0.2); padding-bottom: 12px;'>";
      html += "<button onclick='showDropdownMode()' id='dropdownModeBtn' style='background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;'>From Our List</button>";
      html += "<button onclick='showManualMode()' id='manualModeBtn' style='background: transparent; color: #667eea; border: none; padding: 8px 16px; cursor: pointer; font-size: 13px; font-weight: 500;'>Manual Entry</button>";
      html += "</div>";
      
      // Dropdown Mode
      html += "<div id='dropdownMode'>";
      html += "<div class='book-selector-row'>";
      html += "<select id='bookDropdown' onchange='selectBookFromDropdown()'>";
      html += "<option value=''>Choose a book from our list...</option>";
      
      RECOMMENDATIONS[profile.level].forEach(book => {
        html += "<option value='" + JSON.stringify(book).replace(/'/g, "&#39;") + "'>" + book.title + " by " + book.author + "</option>";
      });
      
      html += "</select>";
      html += "<button class='btn-primary' onclick='addDropdownBook()'>Add</button>";
      html += "</div>";
      html += "</div>";
      
      // Manual Mode
      html += "<div id='manualMode' style='display: none;'>";
      html += "<div style='display: flex; flex-direction: column; gap: 12px;'>";
      html += "<input type='text' id='manualBookTitle' placeholder='Book title' style='width: 100%; padding: 10px 12px; border: 2px solid #e5e5e5; border-radius: 6px; font-size: 14px;'>";
      html += "<input type='text' id='manualBookAuthor' placeholder='Author (optional)' style='width: 100%; padding: 10px 12px; border: 2px solid #e5e5e5; border-radius: 6px; font-size: 14px;'>";
      html += "<input type='number' id='manualBookChapters' placeholder='Total chapters' min='1' style='width: 100%; padding: 10px 12px; border: 2px solid #e5e5e5; border-radius: 6px; font-size: 14px;'>";
      html += "<button class='btn-primary' onclick='addManualBook()' style='width: 100%;'>Add Book</button>";
      html += "</div>";
      html += "</div>";
      html += "</div>";
      
      // Books List
      if (profile.books.length === 0) {
        html += "<p class='empty-message'>No books yet. Add one to get started!</p>";
      } else {
        html += "<div class='book-list'>";
        profile.books.forEach((book, idx) => {
          const pointsPerChapter = LEVELS[profile.level].points;
          const progress = (book.currentChapter / book.chapters) * 100;
          html += "<div class='book-card'>";
          html += "<div class='book-header'>";
          html += "<div><h3 class='book-title'>" + book.title + "</h3>";
          html += "<p class='book-progress'>" + (book.completed ? "Complete ✓" : "Chapter " + book.currentChapter + " / " + book.chapters) + "</p></div>";
          if (!book.completed) {
            html += "<span class='points-badge'>+" + pointsPerChapter + " pts</span>";
          }
          html += "</div>";
          
          if (!book.completed) {
            html += "<div class='progress-bar'><div class='progress-fill' style='width:" + progress + "%'></div></div>";
            html += "<div class='button-group'>";
            html += "<button class='btn-primary' onclick='logChapter(" + idx + ")'>Log chapter</button>";
            if (book.currentChapter === book.chapters) {
              html += "<button class='btn-success' onclick='completeBook(" + idx + ")'>Finish book</button>";
            }
            html += "</div>";
          } else {
            html += "<div class='button-group'>";
            html += "<button class='btn-quiz' onclick='generateQuiz(" + idx + ")'>Take Quiz 🧠</button>";
            html += "</div>";
          }
          html += "</div>";
        });
        html += "</div>";
      }
      
      document.getElementById("bookContent").innerHTML = html;
    }

    }

    function addDropdownBook() {
      const dropdown = document.getElementById("bookDropdown");
      if (!dropdown.value) {
        alert("Please select a book");
        return;
      }
      const book = JSON.parse(dropdown.value);
      const profile = getCurrentProfile();
      profile.books.push({ 
        id: Date.now(), 
        title: book.title, 
        chapters: parseInt(book.chapters), 
        currentChapter: 0, 
        completed: false 
      });
      save();
      renderBooks();
      dropdown.value = "";
    }

    function showDropdownMode() {
      document.getElementById("dropdownMode").style.display = "block";
      document.getElementById("manualMode").style.display = "none";
      document.getElementById("dropdownModeBtn").style.background = "linear-gradient(135deg, #667eea 0%, #764ba2 100%)";
      document.getElementById("dropdownModeBtn").style.color = "white";
      document.getElementById("manualModeBtn").style.background = "transparent";
      document.getElementById("manualModeBtn").style.color = "#667eea";
    }

    function showManualMode() {
      document.getElementById("dropdownMode").style.display = "none";
      document.getElementById("manualMode").style.display = "block";
      document.getElementById("manualModeBtn").style.background = "linear-gradient(135deg, #667eea 0%, #764ba2 100%)";
      document.getElementById("manualModeBtn").style.color = "white";
      document.getElementById("dropdownModeBtn").style.background = "transparent";
      document.getElementById("dropdownModeBtn").style.color = "#667eea";
    }

    function addManualBook() {
      const profile = getCurrentProfile();
      const title = document.getElementById("manualBookTitle").value.trim();
      const author = document.getElementById("manualBookAuthor").value.trim();
      const chapters = parseInt(document.getElementById("manualBookChapters").value);
      
      if (!title) {
        alert("Please enter a book title");
        return;
      }
      if (!chapters || chapters < 1) {
        alert("Please enter number of chapters");
        return;
      }
      
      profile.books.push({ 
        id: Date.now(), 
        title: title,
        author: author || "Unknown",
        chapters: chapters, 
        currentChapter: 0, 
        completed: false 
      });
      
      document.getElementById("manualBookTitle").value = "";
      document.getElementById("manualBookAuthor").value = "";
      document.getElementById("manualBookChapters").value = "";
      
      save();
      renderBooks();
      alert("'" + title + "' added successfully!");
    }

    function addCustomBook() {
      const profile = getCurrentProfile();
      const title = document.getElementById("bookTitle").value.trim();
      const chapters = parseInt(document.getElementById("bookChapters").value);
      if (title && chapters > 0) {
        profile.books.push({ 
          id: Date.now(), 
          title: title, 
          chapters: chapters, 
          currentChapter: 0, 
          completed: false 
        });
        document.getElementById("bookTitle").value = "";
        document.getElementById("bookChapters").value = "";
        save();
        renderBooks();
      } else {
        alert("Please enter a title and chapter count");
      }
    }

    function logChapter(idx) {
      const profile = getCurrentProfile();
      if (profile.books[idx].currentChapter < profile.books[idx].chapters) {
        profile.books[idx].currentChapter++;
        profile.totalPoints += LEVELS[profile.level].points;
        const today = new Date().toDateString();
        const lastDate = profile.lastReadDate ? new Date(profile.lastReadDate).toDateString() : null;
        if (lastDate !== today) {
          profile.currentStreak = (lastDate === new Date(Date.now() - 86400000).toDateString()) ? profile.currentStreak + 1 : 1;
        }
        profile.lastReadDate = today;
        save();
        renderBooks();
      }
    }

    function completeBook(idx) {
      const profile = getCurrentProfile();
      profile.books[idx].completed = true;
      profile.booksRead++;
      save();
      renderBooks();
    }

    function generateQuiz(bookIdx) {
      const profile = getCurrentProfile();
      const book = profile.books[bookIdx];
      
      document.getElementById("quizTitle").textContent = "Quiz: " + book.title;
      document.getElementById("quizModal").classList.add("active");

      const quizData = generateRandomQuiz(book.title);
      currentQuiz = { bookIdx: bookIdx, bookTitle: book.title, data: quizData };
      renderQuiz();
    }

    function generateRandomQuiz(bookTitle) {
      const questions = [
        { type: "multiple", question: "What is the main theme of this book?", options: ["Adventure", "Love", "Mystery", "Survival"], correct: Math.floor(Math.random() * 4) },
        { type: "truefalse", question: "This book was published before 2000.", correct: Math.random() > 0.5 },
        { type: "multiple", question: "Which genre best describes this book?", options: ["Fiction", "Non-fiction", "Fantasy", "Science Fiction"], correct: Math.floor(Math.random() * 4) },
        { type: "truefalse", question: "The main character overcomes a major challenge.", correct: true },
        { type: "shortanswer", question: "What did you enjoy most about reading this book?", correctAnswers: ["great", "amazing", "loved", "enjoyed", "wonderful", "fantastic"] }
      ];
      return { questions: questions };
    }

    function renderQuiz() {
      let html = "";
      currentQuiz.data.questions.forEach((q, idx) => {
        html += "<div class='question-card'>";
        html += "<div class='question-number'>Question " + (idx + 1) + " of " + currentQuiz.data.questions.length + "</div>";
        html += "<div class='question-text'>" + q.question + "</div>";
        
        if (q.type === "multiple") {
          q.options.forEach((opt, optIdx) => {
            html += "<div class='option'><input type='radio' name='q" + idx + "' value='" + optIdx + "' id='opt" + idx + "_" + optIdx + "'><label for='opt" + idx + "_" + optIdx + "'>" + opt + "</label></div>";
          });
        } else if (q.type === "truefalse") {
          html += "<div class='option'><input type='radio' name='q" + idx + "' value='true' id='opt" + idx + "_t'><label for='opt" + idx + "_t'>True</label></div>";
          html += "<div class='option'><input type='radio' name='q" + idx + "' value='false' id='opt" + idx + "_f'><label for='opt" + idx + "_f'>False</label></div>";
        } else if (q.type === "shortanswer") {
          html += "<input type='text' class='short-answer' id='q" + idx + "' placeholder='Your answer'>";
        }
        html += "</div>";
      });
      html += "<button class='btn-primary' onclick='submitQuiz()' style='width:100%;margin-top:16px'>Submit Quiz</button>";
      document.getElementById("quizContent").innerHTML = html;
    }

    function submitQuiz() {
      let score = 0;
      const totalQuestions = currentQuiz.data.questions.length;

      currentQuiz.data.questions.forEach((q, idx) => {
        if (q.type === "multiple") {
          const selected = document.querySelector('input[name="q' + idx + '"]:checked');
          if (selected && parseInt(selected.value) === q.correct) score++;
        } else if (q.type === "truefalse") {
          const selected = document.querySelector('input[name="q' + idx + '"]:checked');
          if (selected && (selected.value === 'true') === q.correct) score++;
        } else if (q.type === "shortanswer") {
          const answer = document.getElementById('q' + idx).value.toLowerCase().trim();
          if (q.correctAnswers.some(a => answer.includes(a.toLowerCase()))) score++;
        }
      });

      const percentage = Math.round((score / totalQuestions) * 100);
      let html = "<div class='quiz-results'>";
      html += "<div class='results-score'>Score: " + score + " / " + totalQuestions + " (" + percentage + "%)</div>";
      html += "<div class='results-detail'>";
      if (percentage >= 80) html += "Excellent! You really know this book!";
      else if (percentage >= 60) html += "Good job! You understand the main points.";
      else html += "Keep reading! Try again later.";
      html += "</div></div>";
      html += "<button class='btn-primary' onclick='closeQuiz()' style='width:100%'>Done</button>";
      
      document.getElementById("quizContent").innerHTML = html;
    }

    function closeQuiz() {
      currentQuiz = null;
      document.getElementById("quizModal").classList.remove("active");
    }

    function renderRecommendations() {
      const profile = getCurrentProfile();
      if (profile.level === null) {
        document.getElementById("recContent").innerHTML = "<p class='empty-message'>Select a reading level first</p>";
        return;
      }
      
      let html = "<h3 style='font-size:16px;color:#667eea;margin-bottom:16px'>" + LEVELS[profile.level].name + " Recommendations</h3>";
      html += "<div class='book-list'>";
      
      RECOMMENDATIONS[profile.level].forEach(book => {
        html += "<div class='book-card'>";
        html += "<div class='book-header'>";
        html += "<div><h3 class='book-title'>" + book.title + "</h3>";
        html += "<p class='book-progress'>by " + book.author + " • " + book.chapters + " chapters</p></div>";
        html += "<span class='points-badge'>+" + LEVELS[profile.level].points + " pts</span>";
        html += "</div>";
        html += "<div class='button-group'>";
        html += "<button class='btn-add' onclick='addRecommendedBook(\"" + book.title.replace(/"/g, '&quot;') + "\", " + book.chapters + ")'>Add to My Books</button>";
        html += "</div>";
        html += "</div>";
      });
      
      html += "</div>";
      document.getElementById("recContent").innerHTML = html;
    }

    function addRecommendedBook(title, chapters) {
      const profile = getCurrentProfile();
      profile.books.push({ 
        id: Date.now(), 
        title: title, 
        chapters: chapters, 
        currentChapter: 0, 
        completed: false 
      });
      save();
      alert("Added '" + title + "' to your books!");
    }

    function renderAchievements() {
      const profile = getCurrentProfile();
      const allAch = [
        { id: "first100", desc: "Earn 100 points", emoji: "⭐", check: () => profile.totalPoints >= 100 },
        { id: "first500", desc: "Earn 500 points", emoji: "🌟", check: () => profile.totalPoints >= 500 },
        { id: "first1000", desc: "Earn 1000 points", emoji: "✨", check: () => profile.totalPoints >= 1000 },
        { id: "book1", desc: "Complete 1 book", emoji: "📖", check: () => profile.booksRead >= 1 },
        { id: "book5", desc: "Complete 5 books", emoji: "📚", check: () => profile.booksRead >= 5 },
        { id: "book10", desc: "Complete 10 books", emoji: "🏆", check: () => profile.booksRead >= 10 },
        { id: "streak7", desc: "7-day reading streak", emoji: "🔥", check: () => profile.currentStreak >= 7 },
        { id: "streak30", desc: "30-day reading streak", emoji: "💥", check: () => profile.currentStreak >= 30 }
      ];
      
      allAch.forEach(ach => {
        if (ach.check() && !profile.achievements.includes(ach.id)) {
          profile.achievements.push(ach.id);
        }
      });
      
      let html = "";
      allAch.forEach(ach => {
        const unlocked = profile.achievements.includes(ach.id);
        html += "<div class='achievement-card " + (unlocked ? "unlocked" : "") + "'>";
        html += "<div class='achievement-emoji'>" + ach.emoji + "</div>";
        html += "<p class='achievement-name'>" + ach.desc + "</p>";
        html += "</div>";
      });
      document.getElementById("achievementsGrid").innerHTML = html;
      save();
    }

    function selectReward(challengeType, rewardId) {
      const profile = getCurrentProfile();
      profile.prizes[challengeType] = rewardId;
      save();
      renderChallenges();
    }

    function renderChallenges() {
      const profile = getCurrentProfile();
      const totalChapters = profile.books.reduce((sum, b) => sum + b.currentChapter, 0);
      const pointsGoal = profile.level !== null ? LEVELS[profile.level].points * 20 : 160;

      let html = "";

      // Weekly Challenge
      const weeklyComplete = (totalChapters % 3) >= 3;
      const weeklyReward = profile.prizes.weekly;
      html += "<div class='challenge-card " + (weeklyComplete ? "completed" : "") + "'>";
      html += "<h3 class='challenge-title'>📖 Weekly Challenge</h3>";
      html += "<p class='challenge-desc'>Read 3 chapters</p>";
      html += "<div class='challenge-progress'><div style='width:" + Math.min(((totalChapters % 3) / 3) * 100, 100) + "%;background: linear-gradient(90deg, #667eea 0%, #764ba2 100%)'></div></div>";
      html += "<p class='challenge-stat'>" + (totalChapters % 3) + " / 3 chapters</p>";
      if (weeklyComplete) {
        html += "<div class='reward-section'>";
        html += "<h4>🎁 Select Your Reward:</h4>";
        html += "<div class='reward-grid'>";
        REWARDS.forEach(reward => {
          html += "<div class='reward-option " + (weeklyReward === reward.id ? "selected" : "") + "' onclick='selectReward(\"weekly\", \"" + reward.id + "\")'>" + reward.icon + "<br>" + reward.name.split(' ')[1] + "</div>";
        });
        html += "</div>";
        if (weeklyReward) {
          html += "<p style='text-align: center; margin-top: 8px; font-size: 12px; color: #e65100;'>You selected: " + REWARDS.find(r => r.id === weeklyReward).name + "</p>";
        }
        html += "</div>";
      }
      html += "</div>";

      // Monthly Challenge
      const monthlyComplete = profile.totalPoints >= pointsGoal;
      const monthlyReward = profile.prizes.monthly;
      html += "<div class='challenge-card " + (monthlyComplete ? "completed" : "") + "'>";
      html += "<h3 class='challenge-title'>⭐ Monthly Challenge</h3>";
      html += "<p class='challenge-desc'>Earn " + pointsGoal + " points</p>";
      html += "<div class='challenge-progress'><div style='width:" + Math.min((profile.totalPoints / pointsGoal) * 100, 100) + "%;background: linear-gradient(90deg, #667eea 0%, #764ba2 100%)'></div></div>";
      html += "<p class='challenge-stat'>" + profile.totalPoints + " / " + pointsGoal + " points</p>";
      if (monthlyComplete) {
        html += "<div class='reward-section'>";
        html += "<h4>🎁 Select Your Reward:</h4>";
        html += "<div class='reward-grid'>";
        REWARDS.forEach(reward => {
          html += "<div class='reward-option " + (monthlyReward === reward.id ? "selected" : "") + "' onclick='selectReward(\"monthly\", \"" + reward.id + "\")'>" + reward.icon + "<br>" + reward.name.split(' ')[1] + "</div>";
        });
        html += "</div>";
        if (monthlyReward) {
          html += "<p style='text-align: center; margin-top: 8px; font-size: 12px; color: #e65100;'>You selected: " + REWARDS.find(r => r.id === monthlyReward).name + "</p>";
        }
        html += "</div>";
      }
      html += "</div>";

      // Streak Challenge
      const streakComplete = profile.currentStreak >= 30;
      const streakReward = profile.prizes.streak;
      html += "<div class='challenge-card " + (streakComplete ? "completed" : "") + "'>";
      html += "<h3 class='challenge-title'>🔥 Streak Challenge</h3>";
      html += "<p class='challenge-desc'>Read for 30 days straight</p>";
      html += "<div class='challenge-progress'><div style='width:" + Math.min((profile.currentStreak / 30) * 100, 100) + "%;background: linear-gradient(90deg, #667eea 0%, #764ba2 100%)'></div></div>";
      html += "<p class='challenge-stat'>" + profile.currentStreak + " / 30 days</p>";
      if (streakComplete) {
        html += "<div class='reward-section'>";
        html += "<h4>🎁 Select Your Reward:</h4>";
        html += "<div class='reward-grid'>";
        REWARDS.forEach(reward => {
          html += "<div class='reward-option " + (streakReward === reward.id ? "selected" : "") + "' onclick='selectReward(\"streak\", \"" + reward.id + "\")'>" + reward.icon + "<br>" + reward.name.split(' ')[1] + "</div>";
        });
        html += "</div>";
        if (streakReward) {
          html += "<p style='text-align: center; margin-top: 8px; font-size: 12px; color: #e65100;'>You selected: " + REWARDS.find(r => r.id === streakReward).name + "</p>";
        }
        html += "</div>";
      }
      html += "</div>";

      document.getElementById("challengesContent").innerHTML = html;
    }

    function updateUI() {
      const profile = getCurrentProfile();
      document.getElementById("profileName").value = profile.name || "";
      document.getElementById("userName").textContent = profile.name || "Guest";
      document.getElementById("userLevel").textContent = profile.level !== null ? "Level: " + LEVELS[profile.level].name : "Level: Not selected";
      document.getElementById("pointsValue").textContent = profile.totalPoints;
      document.getElementById("booksValue").textContent = profile.booksRead;
      document.getElementById("streakValue").textContent = profile.currentStreak;
      document.getElementById("headerAvatar").textContent = profile.avatar || '😊';
      document.querySelectorAll(".level-btn").forEach((btn, idx) => {
        if (idx === profile.level) btn.classList.add("selected");
        else btn.classList.remove("selected");
      });
    }

    renderProfileButtons();
    updateUI();

    // Register service worker for offline support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/Read-Quest/app/sw.js').then(reg => {
        console.log('Service Worker registered');
      }).catch(err => {
        console.log('Service Worker registration failed:', err);
      });
    }
  </script>
