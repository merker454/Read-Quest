<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Quest - Track Your Reading Progress</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .profile-selector {
      padding: 16px 24px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .profile-selector-label {
      font-size: 12px;
      white-space: nowrap;
      opacity: 0.9;
    }
    .profile-btn-wrapper {
      position: relative;
      display: inline-block;
    }
    .profile-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.2s;
      color: white;
    }
    .profile-btn.active {
      background: white;
      color: #667eea;
      border-color: white;
    }
    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: rgba(255,255,255,0.2);
    }
    .profile-btn.active .profile-avatar {
      background: #667eea;
    }
    .profile-delete-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ff4444;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }
    .profile-btn-wrapper:hover .profile-delete-btn {
      display: flex;
    }
    .btn-new-profile {
      padding: 8px 12px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .btn-new-profile:hover {
      background: rgba(255,255,255,0.3);
    }
    .header {
      padding: 24px;
      border-bottom: 1px solid #e5e5e5;
      background: linear-gradient(to bottom, #fafafa, white);
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      font-size: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0f4ff 0%, #faf0ff 100%);
      border: 2px solid #667eea;
    }
    .header h1 { font-size: 28px; font-weight: 700; color: #667eea; }
    .header h1 span { color: #d32f2f; }
    .header-info { text-align: right; }
    .header-info p { font-size: 14px; margin: 0; color: #666; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }
    .stat-card { background: linear-gradient(135deg, #f0f4ff 0%, #faf0ff 100%); padding: 12px; border-radius: 8px; border: 1px solid #e5e5e5; }
    .stat-label { font-size: 12px; color: #999; margin-bottom: 4px; }
    .stat-value { font-size: 20px; font-weight: 700; color: #667eea; }
    .tabs {
      display: flex;
      gap: 8px;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e5e5;
      overflow-x: auto;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      color: #999;
      font-weight: 400;
      white-space: nowrap;
    }
    .tab-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-weight: 500; }
    .tab-content { padding: 24px; display: none; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 14px; display: block; margin-bottom: 8px; font-weight: 500; color: #1a1a1a; }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
    }
    textarea { resize: vertical; min-height: 70px; }
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .avatar-option {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid #e5e5e5;
      border-radius: 12px;
      background: #f9f9f9;
      cursor: pointer;
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .avatar-option:hover {
      border-color: #667eea;
      transform: scale(1.05);
    }
    .avatar-option.selected {
      border-color: #667eea;
      background: linear-gradient(135deg, #f0f4ff 0%, #faf0ff 100%);
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 12px; }
    .level-btn {
      padding: 16px;
      border: 1.5px solid #e5e5e5;
      border-radius: 8px;
      background: #f9f9f9;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
    }
    .level-btn.selected { border-color: #667eea; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .level-subtitle { font-size: 12px; opacity: 0.8; margin-top: 4px; }
    .level-points { font-size: 13px; margin-top: 6px; opacity: 0.9; }
    .add-book-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 8px;
      border: 1px solid #e5e5e5;
      margin-bottom: 24px;
    }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-add { background: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-add:hover { background: #bbdefb; }
    .btn-quiz { background: #fce4ec; color: #c2185b; border: 1px solid #f8bbd0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-delete { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .book-list { display: flex; flex-direction: column; gap: 12px; }
    .book-card { padding: 12px; background: #f9f9f9; border-radius: 8px; border: 1px solid #e5e5e5; border-left: 4px solid #667eea; }
    .book-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px; }
    .book-title { font-size: 15px; font-weight: 500; margin: 0; }
    .book-progress { font-size: 13px; color: #999; margin: 4px 0 0; }
    .points-badge { font-size: 12px; background: #e3f2fd; color: #667eea; padding: 4px 8px; border-radius: 4px; }
    .progress-bar { display: flex; height: 6px; background: #e5e5e5; border-radius: 3px; margin-bottom: 12px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); }
    .button-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .button-group button { flex: 1; min-width: 100px; }
    .empty-message { text-align: center; color: #999; padding: 24px; }
    .quiz-container { background: #f9f9f9; padding: 16px; border-radius: 8px; border: 1px solid #e5e5e5; margin-bottom: 16px; }
    .quiz-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #667eea; }
    .question-card { background: white; padding: 16px; border-radius: 8px; border: 1px solid #e5e5e5; margin-bottom: 16px; }
    .question-number { font-size: 12px; color: #999; margin-bottom: 8px; }
    .question-text { font-size: 14px; font-weight: 500; margin-bottom: 12px; }
    .option { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .option input[type="radio"], .option input[type="checkbox"] { cursor: pointer; }
    .option label { cursor: pointer; flex: 1; }
    .short-answer { width: 100%; padding: 8px 12px; border: 1px solid #e5e5e5; border-radius: 6px; }
    .quiz-results { background: #e8f5e9; padding: 16px; border-radius: 8px; border: 1px solid #c8e6c9; margin-bottom: 16px; }
    .results-score { font-size: 18px; font-weight: 600; color: #2e7d32; margin-bottom: 8px; }
    .results-detail { font-size: 13px; color: #666; }
    .achievement-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .achievement-card { padding: 12px; background: #f9f9f9; border-radius: 8px; border: 1px solid #e5e5e5; text-align: center; opacity: 0.5; }
    .achievement-card.unlocked { background: #e8f5e9; border-color: #c8e6c9; opacity: 1; }
    .achievement-emoji { font-size: 24px; margin-bottom: 6px; }
    .achievement-name { font-size: 12px; color: #999; margin: 0; }
    .challenge-card { padding: 12px; background: #f9f9f9; border-radius: 8px; border: 1px solid #e5e5e5; margin-bottom: 12px; }
    .challenge-card.completed { background: #e8f5e9; border-color: #c8e6c9; }
    .challenge-title { font-size: 15px; font-weight: 500; margin: 0 0 8px; }
    .challenge-desc { font-size: 14px; color: #666; margin: 0 0 12px; }
    .challenge-progress { display: flex; height: 8px; background: #e5e5e5; border-radius: 4px; margin-bottom: 8px; overflow: hidden; }
    .challenge-stat { font-size: 12px; color: #999; margin-bottom: 8px; }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      overflow-y: auto;
    }
    .modal.active {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      margin-top: 20px;
    }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; color: #667eea; }
    .modal-close {
      float: right;
      cursor: pointer;
      font-size: 24px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-selector">
      <span class="profile-selector-label">Reader:</span>
      <div id="profileButtons" style="display:flex;gap:8px;flex:1;overflow-x:auto"></div>
      <button class="btn-new-profile" onclick="showNewProfileModal()">+ New</button>
    </div>

    <div class="header">
      <div class="header-top">
        <div class="header-left">
          <div class="header-avatar" id="headerAvatar">😊</div>
          <div>
            <h1>Read<span>Quest</span></h1>
            <p id="userLevel">Level: Not selected</p>
          </div>
        </div>
        <div class="header-info">
          <p id="userName">Guest</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Points</div>
          <div class="stat-value" id="pointsValue">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Books</div>
          <div class="stat-value" id="booksValue">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Streak</div>
          <div class="stat-value" id="streakValue">0</div>
        </div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('profile')">Profile</button>
      <button class="tab-btn" onclick="switchTab('books')">Books</button>
      <button class="tab-btn" onclick="switchTab('recommendations')">Recommendations</button>
      <button class="tab-btn" onclick="switchTab('achievements')">Achievements</button>
      <button class="tab-btn" onclick="switchTab('challenges')">Challenges</button>
    </div>

    <div class="tab-content active" id="tab-profile">
      <div class="form-group">
        <label class="form-label">Your name</label>
        <input type="text" id="profileName" placeholder="Enter your name" onchange="updateProfile()">
      </div>
      <div class="form-group">
        <label class="form-label">Select your reading level</label>
        <div class="level-grid">
          <button class="level-btn" onclick="selectLevel(0)"><div>Early Reader</div><div class="level-subtitle">Ages 5-8</div><div class="level-points">5 pts/ch</div></button>
          <button class="level-btn" onclick="selectLevel(1)"><div>Junior</div><div class="level-subtitle">Ages 9-12</div><div class="level-points">8 pts/ch</div></button>
          <button class="level-btn" onclick="selectLevel(2)"><div>Teen</div><div class="level-subtitle">Ages 13-16</div><div class="level-points">10 pts/ch</div></button>
          <button class="level-btn" onclick="selectLevel(3)"><div>Adult</div><div class="level-subtitle">Ages 17+</div><div class="level-points">12 pts/ch</div></button>
        </div>
      </div>
    </div>

    <div class="tab-content" id="tab-books">
      <div id="bookContent"></div>
    </div>

    <div class="tab-content" id="tab-recommendations">
      <div id="recContent"></div>
    </div>

    <div class="tab-content" id="tab-achievements">
      <div class="achievement-grid" id="achievementsGrid"></div>
    </div>

    <div class="tab-content" id="tab-challenges">
      <div id="challengesContent"></div>
    </div>
  </div>

  <div class="modal" id="newProfileModal">
    <div class="modal-content">
      <span class="modal-close" onclick="hideNewProfileModal()">&times;</span>
      <div class="modal-title">Create New Reader</div>
      <div class="form-group">
        <label class="form-label">Reader name</label>
        <input type="text" id="newProfileName" placeholder="Enter name">
      </div>
      <div class="form-group">
        <label class="form-label">Choose an avatar</label>
        <div class="avatar-grid" id="avatarGrid"></div>
      </div>
      <button class="btn-primary" onclick="createNewProfile()" style="width:100%">Create reader</button>
    </div>
  </div>

  <div class="modal" id="quizModal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeQuiz()">&times;</span>
      <div class="quiz-title" id="quizTitle"></div>
      <div id="quizContent"></div>
    </div>
  </div>

  <script>
    const AVATARS = ['😊', '🤓', '😎', '🥰', '😌', '🤗', '😄', '🎉'];
    const LEVELS = [
      { name: "Early Reader", ages: "5-8", points: 5 },
      { name: "Junior", ages: "9-12", points: 8 },
      { name: "Teen", ages: "13-16", points: 10 },
      { name: "Adult", ages: "17+", points: 12 }
    ];

    const RECOMMENDATIONS = {
      0: [
        { title: "Charlotte's Web", author: "E.B. White", chapters: 22, description: "A touching story about friendship between a pig and a spider." },
        { title: "The Very Hungry Caterpillar", author: "Eric Carle", chapters: 10, description: "A delightful picture book about a caterpillar's transformation." },
        { title: "Where the Wild Things Are", author: "Maurice Sendak", chapters: 8, description: "A boy sails away to an island filled with wild things." },
        { title: "Winnie-the-Pooh", author: "A.A. Milne", chapters: 20, description: "Classic tales of a bear and his friends in the Hundred Acre Wood." }
      ],
      1: [
        { title: "Percy Jackson and the Olympians", author: "Rick Riordan", chapters: 37, description: "A boy discovers he is the son of a Greek god and goes on epic quests." },
        { title: "Harry Potter", author: "J.K. Rowling", chapters: 34, description: "A young wizard discovers a magical world hidden from muggles." },
        { title: "Wings of Fire", author: "Tui T. Sutherland", chapters: 28, description: "Dragons with prophecies must save their world from war." },
        { title: "The Hunger Games", author: "Suzanne Collins", chapters: 27, description: "A girl must survive a deadly competition in a dystopian future." }
      ],
      2: [
        { title: "The Fault in Our Stars", author: "John Green", chapters: 48, description: "Two teens with life-threatening illnesses meet and fall in love." },
        { title: "Six of Crows", author: "Leigh Bardugo", chapters: 38, description: "Six criminals attempt an impossible heist in a magical world." },
        { title: "The 5th Wave", author: "Rick Yancey", chapters: 40, description: "Aliens invade Earth in waves; a girl must survive the apocalypse." },
        { title: "Shadow of the Fox", author: "Julie Kagawa", chapters: 45, description: "A half-kitsune warrior joins a team to fight demons." }
      ],
      3: [
        { title: "Dune", author: "Frank Herbert", chapters: 68, description: "An epic sci-fi saga set on a desert planet with political intrigue." },
        { title: "The Name of the Wind", author: "Patrick Rothfuss", chapters: 66, description: "A man tells his life story of becoming a powerful wizard." },
        { title: "Project Hail Mary", author: "Andy Weir", chapters: 51, description: "An astronaut must save Earth from extinction on an alien mission." },
        { title: "Educated", author: "Tara Westover", chapters: 40, description: "A memoir about escaping a survivalist family to pursue education." }
      ]
    };

    // Pre-made quizzes for recommended books
    const BOOK_QUIZZES = {
      "Charlotte's Web": {
        questions: [
          { type: "multiple", question: "Who is Wilbur's best friend?", options: ["Charlotte", "Templeton", "Fern", "The Goose"], correct: 0 },
          { type: "truefalse", question: "Wilbur is a cow.", correct: false },
          { type: "multiple", question: "What does Charlotte do to save Wilbur?", options: ["Gives him food", "Spins words in her web", "Runs away with him", "Calls for help"], correct: 1 },
          { type: "truefalse", question: "Charlotte lives for many years.", correct: false },
          { type: "shortanswer", question: "What does Fern bring to Wilbur?", correctAnswers: ["food", "slop", "breakfast", "dinner"] }
        ]
      },
      "Harry Potter": {
        questions: [
          { type: "multiple", question: "What is the name of Harry's best friend?", options: ["Ron Weasley", "Draco Malfoy", "Neville Longbottom", "Cedric Diggory"], correct: 0 },
          { type: "truefalse", question: "Hogwarts is a school for witches and wizards.", correct: true },
          { type: "multiple", question: "Who is Harry's main enemy?", options: ["Snape", "Voldemort", "The Ministry", "Dumbledore"], correct: 1 },
          { type: "truefalse", question: "Harry's parents are alive.", correct: false },
          { type: "shortanswer", question: "What sport does Harry play at Hogwarts?", correctAnswers: ["quidditch", "flying"] }
        ]
      },
      "The Fault in Our Stars": {
        questions: [
          { type: "multiple", question: "Where do Hazel and Gus meet?", options: ["At school", "At a support group", "At a bookstore", "At a hospital"], correct: 1 },
          { type: "truefalse", question: "Both main characters are completely healthy.", correct: false },
          { type: "multiple", question: "Which author do they visit?", options: ["J.K. Rowling", "Peter Van Houten", "Stephen King", "John Green"], correct: 1 },
          { type: "truefalse", question: "The book is set in New York.", correct: false },
          { type: "shortanswer", question: "What is the title of the book the characters read?", correctAnswers: ["An Imperial Affliction", "imperial affliction"] }
        ]
      },
      "Dune": {
        questions: [
          { type: "multiple", question: "What is the desert planet called?", options: ["Caladan", "Arrakis", "Giedi Prime", "Kaitain"], correct: 1 },
          { type: "truefalse", question: "Paul is the heir to House Atreides.", correct: true },
          { type: "multiple", question: "What valuable resource is found on Arrakis?", options: ["Gold", "Spice", "Oil", "Diamonds"], correct: 1 },
          { type: "truefalse", question: "Paul can control sandworms.", correct: false },
          { type: "shortanswer", question: "What is Paul's mother's name?", correctAnswers: ["Lady Jessica", "Jessica"] }
        ]
      },
      "Percy Jackson and the Olympians": {
        questions: [
          { type: "multiple", question: "What is Percy's father's name?", options: ["Zeus", "Hades", "Poseidon", "Ares"], correct: 2 },
          { type: "truefalse", question: "Camp Half-Blood is a safe place for demigods.", correct: true },
          { type: "multiple", question: "Who is Percy's best friend?", options: ["Luke", "Grover", "Annabeth", "Tyson"], correct: 1 },
          { type: "truefalse", question: "Percy loves school.", correct: false },
          { type: "shortanswer", question: "What is the name of Percy's sword?", correctAnswers: ["Riptide", "anaklusmos"] }
        ]
      }
    };

    let allProfiles = JSON.parse(localStorage.getItem("allProfiles")) || [];
    let currentProfileId = localStorage.getItem("currentProfileId");
    let selectedAvatar = '😊';
    let customRecommendations = JSON.parse(localStorage.getItem("customRecommendations")) || {};
    let quizScores = JSON.parse(localStorage.getItem("quizScores")) || {};
    let currentQuiz = null;

    if (allProfiles.length === 0) {
      allProfiles.push({
        id: Date.now(),
        name: "Reader 1",
        avatar: '😊',
        level: null,
        totalPoints: 0,
        booksRead: 0,
        currentStreak: 0,
        lastReadDate: null,
        books: [],
        achievements: [],
        prizes: { weekly: "", monthly: "", streak: "" }
      });
      currentProfileId = allProfiles[0].id;
    }
    if (!currentProfileId) currentProfileId = allProfiles[0].id;

    function getCurrentProfile() {
      return allProfiles.find(p => p.id === parseInt(currentProfileId));
    }

    function save() {
      localStorage.setItem("allProfiles", JSON.stringify(allProfiles));
      localStorage.setItem("currentProfileId", currentProfileId);
      localStorage.setItem("customRecommendations", JSON.stringify(customRecommendations));
      localStorage.setItem("quizScores", JSON.stringify(quizScores));
      updateUI();
    }

    function switchProfile(profileId) {
      currentProfileId = profileId;
      save();
      renderProfileButtons();
    }

    function deleteProfile(profileId, event) {
      event.stopPropagation();
      if (allProfiles.length <= 1) {
        alert("You must have at least one reader!");
        return;
      }
      if (confirm("Delete this reader? This cannot be undone.")) {
        allProfiles = allProfiles.filter(p => p.id !== profileId);
        if (parseInt(currentProfileId) === profileId) {
          currentProfileId = allProfiles[0].id;
        }
        save();
        renderProfileButtons();
      }
    }

    function renderProfileButtons() {
      let html = "";
      allProfiles.forEach(profile => {
        html += "<div class='profile-btn-wrapper'><button class='profile-btn " + (parseInt(currentProfileId) === profile.id ? "active" : "") + "' onclick='switchProfile(" + profile.id + ")'><div class='profile-avatar'>" + (profile.avatar || '😊') + "</div><div>" + profile.name + "</div></button><button class='profile-delete-btn' onclick='deleteProfile(" + profile.id + ", event)'>×</button></div>";
      });
      document.getElementById("profileButtons").innerHTML = html;
    }

    function showNewProfileModal() {
      selectedAvatar = '😊';
      renderAvatarGrid();
      document.getElementById("newProfileModal").classList.add("active");
    }

    function hideNewProfileModal() {
      document.getElementById("newProfileModal").classList.remove("active");
    }

    function renderAvatarGrid() {
      let html = "";
      AVATARS.forEach(avatar => {
        html += "<div class='avatar-option " + (avatar === selectedAvatar ? "selected" : "") + "' onclick='selectAvatar(\"" + avatar + "\")'>" + avatar + "</div>";
      });
      document.getElementById("avatarGrid").innerHTML = html;
    }

    function selectAvatar(avatar) {
      selectedAvatar = avatar;
      renderAvatarGrid();
    }

    function createNewProfile() {
      const name = document.getElementById("newProfileName").value.trim();
      if (name) {
        allProfiles.push({
          id: Date.now(),
          name: name,
          avatar: selectedAvatar,
          level: null,
          totalPoints: 0,
          booksRead: 0,
          currentStreak: 0,
          lastReadDate: null,
          books: [],
          achievements: [],
          prizes: { weekly: "", monthly: "", streak: "" }
        });
        currentProfileId = allProfiles[allProfiles.length - 1].id;
        document.getElementById("newProfileName").value = "";
        hideNewProfileModal();
        save();
        renderProfileButtons();
      }
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
      document.getElementById("tab-" + tab).classList.add("active");
      event.target.classList.add("active");
      if (tab === "books") renderBooks();
      if (tab === "recommendations") renderRecommendations();
      if (tab === "achievements") renderAchievements();
      if (tab === "challenges") renderChallenges();
    }

    function selectLevel(idx) {
      const profile = getCurrentProfile();
      profile.level = idx;
      save();
    }

    function updateProfile() {
      const profile = getCurrentProfile();
      profile.name = document.getElementById("profileName").value;
      save();
    }

    function renderBooks() {
      const profile = getCurrentProfile();
      if (profile.level === null) {
        document.getElementById("bookContent").innerHTML = "<p class='empty-message'>Select a reading level first</p>";
        return;
      }
      let html = "<div class='add-book-form'><input type='text' id='bookTitle' placeholder='Book title'><input type='number' id='bookChapters' placeholder='Total chapters' min='1'><button class='btn-primary' onclick='addBook()'>Add book</button></div>";
      if (profile.books.length === 0) {
        html += "<p class='empty-message'>No books yet. Add one or check Recommendations!</p>";
      } else {
        html += "<div class='book-list'>";
        profile.books.forEach((book, idx) => {
          const pointsPerChapter = LEVELS[profile.level].points;
          const progress = (book.currentChapter / book.chapters) * 100;
          html += "<div class='book-card'><div class='book-header'><div><h3 class='book-title'>" + book.title + "</h3><p class='book-progress'>" + (book.completed ? "Complete ✓" : "Ch " + book.currentChapter + " / " + book.chapters) + "</p></div>" + (!book.completed ? "<span class='points-badge'>+" + pointsPerChapter + " pts</span>" : "") + "</div>";
          if (!book.completed) {
            html += "<div class='progress-bar'><div class='progress-fill' style='width:" + progress + "%'></div></div>";
            html += "<div class='button-group'><button class='btn-primary' onclick='logChapter(" + idx + ")'>Log chapter</button>";
            if (book.currentChapter === book.chapters) {
              html += "<button class='btn-success' onclick='completeBook(" + idx + ")'>Finish book</button>";
            }
            html += "</div>";
          } else {
            html += "<div class='button-group'><button class='btn-quiz' onclick='generateQuiz(" + idx + ")'>Take Quiz 🧠</button></div>";
          }
          html += "</div>";
        });
        html += "</div>";
      }
      document.getElementById("bookContent").innerHTML = html;
    }

    function addBook() {
      const profile = getCurrentProfile();
      const title = document.getElementById("bookTitle").value;
      const chapters = parseInt(document.getElementById("bookChapters").value);
      if (title && chapters > 0) {
        profile.books.push({ id: Date.now(), title: title, chapters: chapters, currentChapter: 0, completed: false });
        document.getElementById("bookTitle").value = "";
        document.getElementById("bookChapters").value = "";
        save();
        renderBooks();
      }
    }

    function logChapter(idx) {
      const profile = getCurrentProfile();
      if (profile.books[idx].currentChapter < profile.books[idx].chapters) {
        profile.books[idx].currentChapter++;
        profile.totalPoints += LEVELS[profile.level].points;
        const today = new Date().toDateString();
        const lastDate = profile.lastReadDate ? new Date(profile.lastReadDate).toDateString() : null;
        if (lastDate !== today) {
          profile.currentStreak = (lastDate === new Date(Date.now() - 86400000).toDateString()) ? profile.currentStreak + 1 : 1;
        }
        profile.lastReadDate = today;
        save();
        renderBooks();
      }
    }

    function completeBook(idx) {
      const profile = getCurrentProfile();
      profile.books[idx].completed = true;
      profile.booksRead++;
      save();
      renderBooks();
    }

    function generateQuiz(bookIdx) {
      const profile = getCurrentProfile();
      const book = profile.books[bookIdx];
      
      document.getElementById("quizTitle").textContent = "Quiz: " + book.title;
      document.getElementById("quizModal").classList.add("active");

      // Check if we have a pre-made quiz
      let quizData;
      if (BOOK_QUIZZES[book.title]) {
        quizData = BOOK_QUIZZES[book.title];
      } else {
        // Generate a simple random quiz for custom books
        quizData = generateRandomQuiz(book.title);
      }

      currentQuiz = { bookIdx: bookIdx, bookTitle: book.title, data: quizData };
      renderQuiz();
    }

    function generateRandomQuiz(bookTitle) {
      const questions = [
        { type: "multiple", question: "What is the main theme of this book?", options: ["Adventure", "Love", "Mystery", "Survival"], correct: Math.floor(Math.random() * 4) },
        { type: "truefalse", question: "This book was published before 2000.", correct: Math.random() > 0.5 },
        { type: "multiple", question: "Which genre best describes this book?", options: ["Fiction", "Non-fiction", "Fantasy", "Science Fiction"], correct: Math.floor(Math.random() * 4) },
        { type: "truefalse", question: "The main character overcomes a major challenge.", correct: true },
        { type: "shortanswer", question: "What did you enjoy most about reading this book?", correctAnswers: ["great", "amazing", "loved", "enjoyed", "wonderful", "fantastic"] }
      ];
      return { questions: questions };
    }

    function renderQuiz() {
      let html = "";
      currentQuiz.data.questions.forEach((q, idx) => {
        html += "<div class='question-card'>";
        html += "<div class='question-number'>Question " + (idx + 1) + "</div>";
        html += "<div class='question-text'>" + q.question + "</div>";
        
        if (q.type === "multiple") {
          q.options.forEach((opt, optIdx) => {
            html += "<div class='option'><input type='radio' name='q" + idx + "' value='" + optIdx + "' id='opt" + idx + "_" + optIdx + "'><label for='opt" + idx + "_" + optIdx + "'>" + opt + "</label></div>";
          });
        } else if (q.type === "truefalse") {
          html += "<div class='option'><input type='radio' name='q" + idx + "' value='true' id='opt" + idx + "_t'><label for='opt" + idx + "_t'>True</label></div>";
          html += "<div class='option'><input type='radio' name='q" + idx + "' value='false' id='opt" + idx + "_f'><label for='opt" + idx + "_f'>False</label></div>";
        } else if (q.type === "shortanswer") {
          html += "<input type='text' class='short-answer' id='q" + idx + "' placeholder='Your answer'>";
        }
        html += "</div>";
      });
      html += "<button class='btn-primary' onclick='submitQuiz()' style='width:100%;margin-top:12px'>Submit Quiz</button>";
      document.getElementById("quizContent").innerHTML = html;
    }

    function submitQuiz() {
      let score = 0;
      const totalQuestions = currentQuiz.data.questions.length;

      currentQuiz.data.questions.forEach((q, idx) => {
        if (q.type === "multiple") {
          const selected = document.querySelector('input[name="q' + idx + '"]:checked');
          if (selected && parseInt(selected.value) === q.correct) score++;
        } else if (q.type === "truefalse") {
          const selected = document.querySelector('input[name="q' + idx + '"]:checked');
          if (selected && (selected.value === 'true') === q.correct) score++;
        } else if (q.type === "shortanswer") {
          const answer = document.getElementById('q' + idx).value.toLowerCase().trim();
          if (q.correctAnswers.some(a => answer.includes(a.toLowerCase()))) score++;
        }
      });

      const percentage = Math.round((score / totalQuestions) * 100);
      let html = "<div class='quiz-results'>";
      html += "<div class='results-score'>Score: " + score + " / " + totalQuestions + " (" + percentage + "%)</div>";
      html += "<div class='results-detail'>";
      if (percentage >= 80) html += "Excellent! You really know this book!";
      else if (percentage >= 60) html += "Good job! You understand the main points.";
      else html += "Keep reading! Try again later.";
      html += "</div></div>";
      html += "<button class='btn-primary' onclick='closeQuiz()' style='width:100%'>Done</button>";
      
      document.getElementById("quizContent").innerHTML = html;
    }

    function closeQuiz() {
      currentQuiz = null;
      document.getElementById("quizModal").classList.remove("active");
    }

    function renderRecommendations() {
      const profile = getCurrentProfile();
      if (profile.level === null) {
        document.getElementById("recContent").innerHTML = "<p class='empty-message'>Select a reading level first</p>";
        return;
      }
      let html = "<div class='add-book-form' style='background:#f0f7ff;border-color:#bbdefb'><h3 style='margin:0 0 12px;font-size:15px'>Add your own recommendation</h3>";
      html += "<input type='text' id='customTitle' placeholder='Book title'>";
      html += "<input type='text' id='customAuthor' placeholder='Author'>";
      html += "<input type='number' id='customChapters' placeholder='Chapters' min='1'>";
      html += "<textarea id='customDesc' placeholder='Description (optional)'></textarea>";
      html += "<button class='btn-primary' onclick='addCustomRecommendation()'>Add recommendation</button>";
      html += "</div>";

      LEVELS.forEach((level, levelIdx) => {
        html += "<div style='margin-bottom:20px'><h3 style='font-size:16px;margin-bottom:12px;color:#667eea'>" + level.name + "</h3>";
        
        RECOMMENDATIONS[levelIdx].forEach(book => {
          html += "<div style='padding:12px;background:#f9f9f9;border-radius:8px;margin-bottom:8px;border-left:3px solid #667eea'><h4 style='margin:0 0 4px;font-size:14px'>" + book.title + "</h4><p style='margin:0 0 4px;font-size:12px;color:#666'>by " + book.author + "</p><p style='margin:0 0 8px;font-size:13px;color:#999'>" + book.description + "</p><div style='display:flex;gap:8px;justify-content:space-between'><span style='font-size:12px;color:#667eea'>+" + level.points + " pts/ch</span><button class='btn-add' onclick='addFromRec(\"" + book.title + "\", " + book.chapters + ", \"" + book.author + "\")'>Add</button></div></div>";
        });
        html += "</div>";
      });
      
      document.getElementById("recContent").innerHTML = html;
    }

    function addCustomRecommendation() {
      const title = document.getElementById("customTitle").value;
      const author = document.getElementById("customAuthor").value;
      const chapters = parseInt(document.getElementById("customChapters").value);
      const description = document.getElementById("customDesc").value || "A book I recommend.";

      if (title && author && chapters > 0) {
        if (!customRecommendations[0]) customRecommendations[0] = [];
        customRecommendations[0].push({ title: title, author: author, chapters: chapters, description: description });
        document.getElementById("customTitle").value = "";
        document.getElementById("customAuthor").value = "";
        document.getElementById("customChapters").value = "";
        document.getElementById("customDesc").value = "";
        save();
        renderRecommendations();
      }
    }

    function addFromRec(title, chapters, author) {
      const profile = getCurrentProfile();
      profile.books.push({ id: Date.now(), title: title, chapters: chapters, currentChapter: 0, completed: false });
      save();
    }

    function renderAchievements() {
      const profile = getCurrentProfile();
      const allAch = [
        { id: "first100", desc: "Earn 100 points", check: () => profile.totalPoints >= 100 },
        { id: "first500", desc: "Earn 500 points", check: () => profile.totalPoints >= 500 },
        { id: "first1000", desc: "Earn 1000 points", check: () => profile.totalPoints >= 1000 },
        { id: "book1", desc: "Complete 1 book", check: () => profile.booksRead >= 1 },
        { id: "book5", desc: "Complete 5 books", check: () => profile.booksRead >= 5 },
        { id: "book10", desc: "Complete 10 books", check: () => profile.booksRead >= 10 },
        { id: "streak7", desc: "7-day reading streak", check: () => profile.currentStreak >= 7 },
        { id: "streak30", desc: "30-day reading streak", check: () => profile.currentStreak >= 30 }
      ];
      allAch.forEach(ach => {
        if (ach.check() && !profile.achievements.includes(ach.id)) {
          profile.achievements.push(ach.id);
        }
      });
      let html = "";
      allAch.forEach(ach => {
        const unlocked = profile.achievements.includes(ach.id);
        html += "<div class='achievement-card " + (unlocked ? "unlocked" : "") + "'><div class='achievement-emoji'>⭐</div><p class='achievement-name'>" + ach.desc + "</p></div>";
      });
      document.getElementById("achievementsGrid").innerHTML = html;
      save();
    }

    function renderChallenges() {
      const profile = getCurrentProfile();
      const totalChapters = profile.books.reduce((sum, b) => sum + b.currentChapter, 0);
      const pointsGoal = profile.level !== null ? LEVELS[profile.level].points * 20 : 160;

      let html = "<div class='challenge-card'><h3 class='challenge-title'>Weekly Challenge</h3><p class='challenge-desc'>Read 3 chapters</p><div class='challenge-progress'><div style='width:" + Math.min((totalChapters % 3) * 33, 100) + "%;background: linear-gradient(90deg, #667eea 0%, #764ba2 100%)'></div></div><p class='challenge-stat'>" + Math.min(totalChapters % 3, 3) + " / 3</p></div>";

      html += "<div class='challenge-card'><h3 class='challenge-title'>Monthly Challenge</h3><p class='challenge-desc'>Earn " + pointsGoal + " points</p><div class='challenge-progress'><div style='width:" + Math.min((profile.totalPoints / pointsGoal) * 100, 100) + "%;background: linear-gradient(90deg, #667eea 0%, #764ba2 100%)'></div></div><p class='challenge-stat'>" + profile.totalPoints + " / " + pointsGoal + "</p></div>";

      html += "<div class='challenge-card'><h3 class='challenge-title'>Streak Challenge</h3><p class='challenge-desc'>Read for 30 days straight</p><div class='challenge-progress'><div style='width:" + Math.min((profile.currentStreak / 30) * 100, 100) + "%;background: linear-gradient(90deg, #667eea 0%, #764ba2 100%)'></div></div><p class='challenge-stat'>" + profile.currentStreak + " / 30</p></div>";

      document.getElementById("challengesContent").innerHTML = html;
    }

    function updateUI() {
      const profile = getCurrentProfile();
      document.getElementById("profileName").value = profile.name || "";
      document.getElementById("userName").textContent = profile.name || "Guest";
      document.getElementById("userLevel").textContent = profile.level !== null ? "Level: " + LEVELS[profile.level].name : "Level: Not selected";
      document.getElementById("pointsValue").textContent = profile.totalPoints;
      document.getElementById("booksValue").textContent = profile.booksRead;
      document.getElementById("streakValue").textContent = profile.currentStreak;
      document.getElementById("headerAvatar").textContent = profile.avatar || '😊';
      document.querySelectorAll(".level-btn").forEach((btn, idx) => {
        if (idx === profile.level) btn.classList.add("selected");
        else btn.classList.remove("selected");
      });
    }

    renderProfileButtons();
    updateUI();
  </script>
</body>
</html>
